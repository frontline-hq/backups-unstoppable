services:
  sftp:
    image: atmoz/sftp
    volumes:
      - ../vars/test/host_id_ed25519:/etc/ssh/ssh_host_ed25519_key:ro,Z
      - ../vars/test/user_id_ed25519.pub:/home/${SFTP_USER}/.ssh/keys/id_ed25519.pub:ro,Z
      - ../src/genbackupdata.sh:/home/${SFTP_USER}/genbackupdata.sh:ro,Z
      - ../src/scripts/sftp-test-init.sh:/etc/sftp.d/sftp-test-init.sh:ro,Z
    command: "${SFTP_USER}::1001"
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "bash", "-c", "< /dev/tcp/localhost/22"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 5s
  minio:
    image: minio/minio
    ports:
      - "9001:9001"
    command: server /data --console-address ":9001"
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 10s
networks:
  test-net:
    name: test-net-external
